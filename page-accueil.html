<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partenariat simplifié</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://hantaranui.github.io/Bandeau_France-Travail/bandeau.js" data-titre="Partenariat simplifié"></script>
    <link href="https://cdn.francetravail.fr/studio/design-system/css/styles.css" rel="stylesheet">
    <script src="https://cdn.francetravail.fr/webco/v1/ft-autoloader.js" fetchpriority="high"></script>
    <style>
/* Toutes nos classes portent le prefixe « home- » : le design system est charge
   avant cette feuille, et reprendre un de ses noms (header, card, title...) nous
   ferait heriter de ses regles sans le voir. */

/* Fond et couleur du texte vont ensemble : si seul le fond etait pose, un texte
   clair herite d'un theme sombre de Grist deviendrait illisible sur le blanc.
   Sous « outil-agent », --ft-color-background-layout-body est bleu pale : le
   blanc vient de --ft-color-background-neutral-light. */
body {
  margin: 0;
  min-height: 100vh;
  background: var(--ft-color-background-neutral-light);
  color: var(--ft-color-text-content-default);
}

.home-main {
  padding: 2rem 1.5rem;
}

/* Une colonne : le texte d'abord, la photo dessous (meme ordre que dans le HTML,
   donc meme ordre de lecture au clavier et au lecteur d'ecran). */
.home-content {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--ft-spacer-m2);
  align-items: center;
  max-width: 80rem;
  margin: 0 auto;
}

/* Police, taille et graisse viennent de .t1 : on ne regle que l'encre, l'alignement
   et la marge basse que .t1 ajoute (l'ecart vient du gap de la grille). */
.home-intro {
  margin: 0;
  text-align: left;
  color: var(--ft-color-text-content-strong);
}

/* Petit ecran : hauteur limitee, photo recadree au centre. */
.home-photo {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  object-position: 50% 50%;
}

/* 768 px est le point « md » du design system. Deux colonnes de meme largeur ;
   la photo reprend son rapport d'origine, sans recadrage. */
@media (min-width: 768px) {
  .home-content {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--ft-spacer-l1);
  }
  .home-photo { aspect-ratio: auto; }
}

@media (max-width: 600px) {
  .home-main { padding: 1.5rem 1rem; }
}
</style>
  </head>
  <body class="outil-agent">
    <!-- Titre principal visible seulement des lecteurs d'écran : le bandeau commun n'a pas de h1. -->
    <h1 class="sr-only">Partenariat simplifié – Accueil</h1>

    <main class="home-main">
      <div class="home-content">
        <p class="t1 home-intro">Bienvenue sur l'outil Partenariat simplifié qui vous aidera à gérer et piloter les actions d'insertion par le sport.</p>
        <img class="home-photo" src="photo-accueil.jpg" alt="" width="1200" height="800">
      </div>
    </main>

    <script>
"use strict";

// La page est statique : elle n'affiche plus que le texte d'accueil et une photo,
// et ne lit ni n'ecrit aucune table du document. Le niveau « full » est conserve
// tel quel, car le retirer est hors demande et pourrait priver le bandeau commun
// de ce dont il a besoin.
grist.ready({requiredAccess: "full"});
</script>
  </body>
</html>
